name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The kernel driver (kernel_fuzzer.c) needs a legacy WDK build environment
# and a privileged kernel VM to load, so it is not built here. CI verifies
# the user-mode orchestrator, which is what can be exercised without a VM.
jobs:
  orchestrator:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check the orchestrator
        run: python -m py_compile src/client.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
